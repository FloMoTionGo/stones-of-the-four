<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GLB viewer</title>
<style>body{margin:0;background:#2a2d38}canvas{display:block}#info{position:fixed;left:8px;top:8px;color:#e9e2d2;font:13px monospace;white-space:pre}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const url = q.get('glb') || '../assets/models/fire.glb';
const views = (q.get('views') || 'front,side,top,iso').split(',');
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2d38);
scene.add(new THREE.HemisphereLight(0xb9c8dd, 0x1a1e27, 1.2));
const sun = new THREE.DirectionalLight(0xffd9c0, 2.2); sun.position.set(3, 5, 2); scene.add(sun);
const loader = new GLTFLoader();
const info = document.getElementById('info');
loader.load(url, gltf => {
  const root = gltf.scene;
  let tris = 0, mats = new Set(), meshes = 0, textured = 0;
  root.traverse(o => { if (o.isMesh) { meshes++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; mats.add(o.material); if (o.material.map) textured++; } });
  const box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  root.position.sub(c);
  scene.add(root);
  const r = size.length() * 0.6;
  const n = views.length, cw = W / n;
  renderer.setScissorTest(true);
  const camPos = { front: [0, 0, 1], side: [1, 0, 0], top: [0, 1, 0.0001], iso: [1, 0.8, 1], back: [0, 0, -1] };
  views.forEach((v, i) => {
    const cam = new THREE.PerspectiveCamera(35, cw / H, 0.01, 100);
    const d = camPos[v] || camPos.iso; cam.position.set(d[0], d[1], d[2]).normalize().multiplyScalar(r * 3.2); cam.lookAt(0, 0, 0);
    renderer.setViewport(i * cw, 0, cw, H); renderer.setScissor(i * cw, 0, cw, H);
    renderer.render(scene, cam);
  });
  const txt = `${url}\nmeshes ${meshes}  tris ${Math.round(tris)}  materials ${mats.size}  textured ${textured}\nsize ${size.x.toFixed(3)} x ${size.y.toFixed(3)} x ${size.z.toFixed(3)}\nviews: ${views.join(' | ')}`;
  info.textContent = txt; window.__glbInfo = { meshes, tris: Math.round(tris), materials: mats.size, textured, size: [size.x, size.y, size.z] };
  window.__ready = true;
}, undefined, err => { info.textContent = 'load error: ' + err; window.__ready = true; window.__glbInfo = { error: String(err) }; });
</script>
</body>
</html>
